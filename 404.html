<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <!-- ============================================================
         BAPAN SK — CUSTOM 404 PAGE
    ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found — Bapan Sk</title>
    <meta name="description" content="Oops! The page you are looking for does not exist.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0f1e">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="error-page-body">

    <div id="scroll-progress" aria-hidden="true"><span></span></div>

    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>

    <canvas id="particles-canvas" aria-hidden="true"></canvas>

    <div class="floating-shapes" aria-hidden="true">
        <span class="shape shape-1"></span>
        <span class="shape shape-2"></span>
        <span class="shape shape-3"></span>
        <span class="shape shape-4"></span>
        <span class="shape shape-5"></span>
    </div>

    <main class="error-page">
        <div class="error-glow"></div>
        <div class="error-code" data-aos="fade-up">4<span class="gradient-text">0</span>4</div>
        <h1 data-aos="fade-up" data-aos-delay="100">Oops! Page not found</h1>
        <p data-aos="fade-up" data-aos-delay="200">
            The page you're looking for doesn't exist or has been moved.<br>
            Let's get you back on track.
        </p>
        <div class="error-actions" data-aos="fade-up" data-aos-delay="300">
            <a href="index.html" class="btn btn-gradient"><i class="fas fa-home"></i> Back to Home</a>
            <a href="contact.html" class="btn btn-outline"><i class="fas fa-envelope"></i> Contact Me</a>
        </div>
    </main>

    <script src="js/particles.js" defer></script>
    <script src="js/script.js" defer></script>
</body>
</html>
